[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosport"
version = "0.1.0"
description = "Shared DOS-asset toolkit for Busidol remakes (johab / PCX / VOC / PAL / SPR-probe)"
requires-python = ">=3.11"

[project.scripts]
dosport = "dosport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
