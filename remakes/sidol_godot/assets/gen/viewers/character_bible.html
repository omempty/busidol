const listEl = document.getElementById('char-list');
const titleEl = document.getElementById('char-title');
const tokenEl = document.getElementById('char-token');
const exprEl = document.getElementById('expr-container');

Object.keys(data).forEach((id, idx) => {
  const item = document.createElement('div');
  item.className = 'char-item' + (idx === 0 ? ' active' : '');
  item.textContent = data[id].name + ' (' + id + ')';
  item.onclick = () => selectChar(id, item);
  listEl.appendChild(item);
});

function selectChar(id, itemEl) {
  document.querySelectorAll('.char-item').forEach(el => el.classList.remove('active'));
  itemEl.classList.add('active');
  const info = data[id];
  titleEl.innerHTML = info.name + ' <span style="font-size:14px; color:#8892b0;">(' + id + ')</span> <span class="badge">✔ 8-bit Palette PASS</span>';
  tokenEl.textContent = info.token;
  exprEl.innerHTML = '';
  Object.keys(info.expressions).forEach(expr => {
    const card = document.createElement('div');
    card.className = 'expr-card';
    card.innerHTML = `<img src="${info.expressions[expr]}"><div class="expr-label">${expr}</div>`;
    exprEl.appendChild(card);
  });
}

selectChar(Object.keys(data)[0], listEl.children[0]);
</script>
