  #sidebar { width: 340px; background: #1a1d26; border-right: 1px solid #2a2f3d; padding: 16px; overflow-y: auto; }

  h3 { color: #ffb74d; margin: 16px 0 8px 0; font-size: 14px; }

  .canvas-box { background: #0c0e14; border: 2px solid #333a4d; padding: 16px; border-radius: 8px; text-align: center; }
  canvas { image-rendering: pixelated; border: 1px solid #555; background: repeating-conic-gradient(#1e222d 0% 25%, #151821 0% 50%) 50% / 16px 16px; }

const sList = document.getElementById('single-list');
Object.keys(meta.tiles).forEach(t => {
  const d = document.createElement('div');
  d.className = 'chk-item';
  d.innerHTML = `<span>${t}</span><span class="pass">✔ PASS (≥10c)</span>`;
  sList.appendChild(d);
});

const mList = document.getElementById('multi-list');
multi.forEach(m => {
  const d = document.createElement('div');
  d.className = 'chk-item';
  d.innerHTML = `<span>${m.name}</span><span class="pass">✔ READY</span>`;
  mList.appendChild(d);
});

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const infoEl = document.getElementById('info');

img.onload = () => {
  ctx.drawImage(img, 0, 0, 512, 256);
  drawGrid();
};

function drawGrid() {
  ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
  ctx.lineWidth = 1;
  for(let x=0; x<=512; x+=64) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,256); ctx.stroke(); }
  for(let y=0; y<=256; y+=64) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(512,y); ctx.stroke(); }
}

cv.onmousemove = (e) => {
  const rect = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / 64);
  const y = Math.floor((e.clientY - rect.top) / 64);
  const tName = Object.keys(meta.tiles).find(k => meta.tiles[k].col === x && meta.tiles[k].row === y);
  if(tName) {
    infoEl.textContent = `Tile: ${tName} | Grid: [${x}, ${y}] | Atlas: [${x*32}px, ${y*32}px]`;
  } else {
    infoEl.textContent = `Empty Slot [${x}, ${y}]`;
  }
};
