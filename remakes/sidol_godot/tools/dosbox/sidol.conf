# DOSBox 설정 — BSD 시돌이의 모험 실행 + 캡처 (2026-08-24)
# 스크린샷: Ctrl+F5  (PNG가 captures 경로에 image_XXX.png로 저장됨)

[sdl]
output=surface

[dosbox]
machine=svga_s3
captures=D:\Project\Etc\Old\부싯돌시절\remakes\sidol_godot\assets\raw\dosbox_capture

[cpu]
core=normal
cycles=fixed 20000

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1

[autoexec]
mount c "D:\Project\Etc\Old\부싯돌시절\originals\1995_sidol_bsd_dos"
c:
sidol.exe
exit
